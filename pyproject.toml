[project]
name = "hestia-pyrox-klimatos"
version = "2026.10.27"
description = "Research software for heat strain at mass-participation events (HESTIA), population heat strain (PYROX) and local climate trends (Klimatos), with the Thermopoulos weather data engine."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Koos de Boer" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.0",
  "pythermalcomfort==4.6.2",   # exact: jos3_leeftijd.py patches JOS-3 in memory, verified only for 4.6.2
  "pvlib>=0.10",
  "timezonefinder>=6.0",
  "pytz>=2023.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "tqdm>=4.62",
  "colorama>=0.4",
  "python-docx>=1.0",
  "fitdecode>=0.10",
  "requests>=2.28",
  "xlsxwriter>=3.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
test = ["pytest>=8"]

# The suite is a flat collection of scripts and modules, run from its own folder;
# it is not packaged for "pip install". This file holds metadata, the
# compatible dependency ranges and the pytest configuration.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: JOS-3 Monte Carlo test scripts (several minutes each)"]
