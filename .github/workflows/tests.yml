name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: pip install -r requirements.txt
      - name: fast tests + golden-output check
        env:
          HESTIA_REQUIRE_DOCX: "1"
        run: pytest -q
      - name: slow tests (JOS-3 Monte Carlo)
        run: pytest -q -m slow
